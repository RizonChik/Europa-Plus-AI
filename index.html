<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Онлайн-радио — Европа Плюс и другие станции</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --card: rgba(20, 23, 33, .78);
      --line: rgba(255, 255, 255, .08);
      --text: #fff;
      --muted: rgba(255, 255, 255, .6);
      --hue: 335;
      --accent: hsl(var(--hue) 95% 62%);
      --accent-2: hsl(calc(var(--hue) + 45) 90% 62%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; }

    /* Анимированный фон */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
    .bg i {
      position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
      filter: blur(80px); opacity: .45; transition: background .8s ease;
      animation: drift 22s ease-in-out infinite alternate;
    }
    .bg i:nth-child(1) { background: var(--accent); top: -25vmax; left: -20vmax; }
    .bg i:nth-child(2) { background: var(--accent-2); bottom: -30vmax; right: -20vmax; animation-duration: 28s; }
    .bg i:nth-child(3) { background: hsl(calc(var(--hue) + 120) 80% 55%); top: 30%; left: 40%; width: 40vmax; height: 40vmax; opacity: .18; animation-duration: 34s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(8vw, 6vh) scale(1.15); }
    }

    .app {
      display: grid; gap: 24px; padding: 32px 16px;
      grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
      max-width: 1100px; margin: 0 auto; min-height: 100vh; align-items: start;
    }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; padding: 16px; gap: 16px; }
    }

    /* Плеер */
    .player {
      position: sticky; top: 24px;
      padding: 28px; border-radius: 28px;
      background: var(--card); border: 1px solid var(--line);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .45);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      text-align: center;
    }
    @media (max-width: 820px) { .player { position: static; } }

    .cover {
      position: relative; width: 168px; height: 168px; margin: 4px auto 20px;
      border-radius: 50%; display: grid; place-items: center;
      background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent));
      box-shadow: 0 0 60px hsla(var(--hue), 95%, 60%, .35);
      transition: box-shadow .6s ease;
    }
    .cover span {
      width: 146px; height: 146px; border-radius: 50%; display: grid; place-items: center;
      background: #12151e; font-size: 46px; font-weight: 800; letter-spacing: -.02em;
    }
    .cover.playing { animation: spin 14s linear infinite; }
    .cover.playing span { animation: spin 14s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .badge { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 8px 0 4px; font-size: 28px; line-height: 1.15; }
    .info-line { margin: 0 0 18px; color: var(--muted); font-size: 14px; min-height: 1.2em; }

    /* Эквалайзер */
    .eq { display: flex; justify-content: center; align-items: flex-end; gap: 5px; height: 34px; margin-bottom: 14px; }
    .eq span {
      width: 6px; height: 100%; border-radius: 3px; transform-origin: bottom;
      background: linear-gradient(to top, var(--accent), var(--accent-2));
      transform: scaleY(.15); transition: transform .3s ease;
    }
    .eq.on span { animation: eq 1s ease-in-out infinite alternate; }
    .eq.on span:nth-child(2) { animation-delay: -.3s; animation-duration: .7s; }
    .eq.on span:nth-child(3) { animation-delay: -.6s; animation-duration: 1.1s; }
    .eq.on span:nth-child(4) { animation-delay: -.2s; animation-duration: .8s; }
    .eq.on span:nth-child(5) { animation-delay: -.5s; animation-duration: 1.2s; }
    @keyframes eq { from { transform: scaleY(.15); } to { transform: scaleY(1); } }

    .status { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 22px; font-size: 14px; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #5b6170; }
    .live .dot { background: var(--accent); box-shadow: 0 0 14px var(--accent); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    .controls { display: flex; align-items: center; justify-content: center; gap: 22px; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; }
    .play {
      width: 78px; height: 78px; border-radius: 50%;
      background: #fff; color: #11131a; font-size: 30px;
      box-shadow: 0 12px 30px rgba(255, 255, 255, .18);
      transition: transform .15s ease;
    }
    .play:active { transform: scale(.94); }
    .side {
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255, 255, 255, .08); font-size: 20px;
      transition: background .2s ease;
    }
    .side:hover { background: rgba(255, 255, 255, .16); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .volume { margin-top: 26px; text-align: left; }
    .volume-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .hint { margin: 22px 0 0; font-size: 12px; line-height: 1.5; color: var(--muted); opacity: .75; }

    /* Список станций */
    .stations {
      padding: 24px; border-radius: 28px; background: var(--card);
      border: 1px solid var(--line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      min-width: 0;
    }
    .stations-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    h2 { margin: 0; font-size: 20px; }
    #count { font-size: 13px; color: var(--muted); }
    #search {
      width: 100%; margin: 16px 0; padding: 12px 16px; border-radius: 14px;
      border: 1px solid var(--line); background: rgba(0, 0, 0, .25); color: var(--text); font: inherit; font-size: 15px;
    }
    #search::placeholder { color: var(--muted); }
    #list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 68vh; overflow-y: auto; padding-right: 4px; }
    @media (max-width: 820px) { #list { max-height: none; } }
    .station {
      display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 12px;
      border-radius: 16px; background: rgba(255, 255, 255, .04); text-align: left;
      transition: background .2s ease, transform .15s ease;
    }
    .station:hover { background: rgba(255, 255, 255, .09); }
    .station:active { transform: scale(.99); }
    .station.active { background: linear-gradient(90deg, hsla(var(--hue), 95%, 60%, .28), rgba(255, 255, 255, .04)); }
    .avatar {
      flex: 0 0 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
      font-weight: 800; font-size: 16px; color: #fff;
      background: hsl(var(--h) 80% 50%);
    }
    .avatar img, .cover-img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; background: #fff; }
    .cover-img { position: absolute; width: 146px; height: 146px; object-fit: contain; padding: 22px; background: #fff; }
    .station.failed { opacity: .45; }
    .station.failed .sub::after { content: " · недоступна"; }
    .meta { min-width: 0; flex: 1; }
    .name { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now { font-size: 12px; color: var(--accent); white-space: nowrap; }
    .muted { color: var(--muted); font-size: 14px; margin: 14px 0 0; }
    .section-label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 6px 4px 0; }

    @media (prefers-reduced-motion: reduce) {
      .bg i, .cover, .cover span, .eq.on span, .live .dot { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="app">
    <section class="player" id="player">
      <div class="cover" id="cover"><span id="coverText">E+</span><img id="coverImg" class="cover-img" alt="" hidden /></div>
      <div class="badge">Онлайн-радио</div>
      <h1 id="stationName">Европа Плюс</h1>
      <p class="info-line" id="stationInfo">Прямой эфир</p>

      <div class="eq" id="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="status" id="statusWrap"><span class="dot"></span><span id="status">Подключение…</span></div>

      <div class="controls">
        <button class="side" id="prev" type="button" aria-label="Предыдущая станция">⏮</button>
        <button class="play" id="toggle" type="button" aria-label="Воспроизвести">▶</button>
        <button class="side" id="next" type="button" aria-label="Следующая станция">⏭</button>
      </div>

      <div class="volume">
        <div class="volume-row"><span>Громкость</span><span id="volumeValue">70%</span></div>
        <input id="volume" type="range" min="0" max="100" value="70" aria-label="Громкость" />
      </div>

      <p class="hint">Плеер пытается включиться сам. Если браузер запретил автозапуск со звуком, нажми ▶ один раз.</p>
    </section>

    <section class="stations">
      <div class="stations-head">
        <h2>Станции</h2>
        <span id="count"></span>
      </div>
      <input id="search" type="search" placeholder="Поиск станции…" aria-label="Поиск станции" />
      <ul id="list" aria-label="Список станций"></ul>
      <p class="muted" id="listStatus"></p>
    </section>
  </main>

  <audio id="radio" preload="none"></audio>

  <script>
    // Европа Плюс — станция по умолчанию (всегда открывается первой)
    const EUROPA = {
      id: "europa",
      name: "Европа Плюс",
      info: "Основной эфир · MP3 256 kbps",
      abbr: "E+",
      hue: 335,
      streams: [
        "https://ep256.hostingradio.ru:8052/europaplus256.mp3",
        "https://epdop.hostingradio.ru:8033/europaplus32.aacp"
      ]
    };

    // Открытый каталог радиостанций. Пробуем несколько серверов по очереди.
    const CATALOG_HOSTS = [
      "https://de1.api.radio-browser.info",
      "https://nl1.api.radio-browser.info",
      "https://at1.api.radio-browser.info"
    ];

    const $ = (id) => document.getElementById(id);
    const radio = $("radio");
    const toggle = $("toggle");
    const volume = $("volume");
    const list = $("list");
    const search = $("search");

    let catalog = [];          // станции из каталога
    let current = EUROPA;      // текущая станция
    let streamIndex = 0;
    let isPlaying = false;
    let stallTimer = null;     // таймер «поток завис»
    const failed = new Set();  // id станций, которые не запустились

    // ---------- Утилиты ----------
    function hueOf(text) {
      let h = 0;
      for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) % 360;
      return h;
    }

    function setStatus(text, live = false) {
      $("status").textContent = text;
      $("statusWrap").classList.toggle("live", live);
    }

    function setPlayingUI(playing) {
      isPlaying = playing;
      toggle.textContent = playing ? "❚❚" : "▶";
      toggle.setAttribute("aria-label", playing ? "Пауза" : "Воспроизвести");
      $("eq").classList.toggle("on", playing);
      $("cover").classList.toggle("playing", playing);
      if (playing) setStatus("В эфире", true);
      else if (!$("status").textContent.startsWith("Нажми") && !$("status").textContent.startsWith("Поток")) setStatus("Пауза");
    }

    // Логотип станции: картинка из каталога, при ошибке остаются инициалы
    function appendLogo(el, s) {
      el.textContent = s.abbr || initials(s.name);
      if (!s.favicon) return;
      const img = new Image();
      img.alt = "";
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.onload = () => { el.textContent = ""; el.append(img); };
      img.src = s.favicon;
    }

    function setCoverLogo(s) {
      const img = $("coverImg");
      img.hidden = true;
      img.onload = null;
      img.onerror = null;
      img.removeAttribute("src");
      if (!s.favicon) return;
      img.onload = () => { img.hidden = false; };
      img.onerror = () => { img.hidden = true; };
      img.src = s.favicon;
    }

    function applyTheme(station) {
      document.documentElement.style.setProperty("--hue", station.hue);
    }

    function updateNowPlaying() {
      $("stationName").textContent = current.name;
      $("stationInfo").textContent = current.info || "Онлайн-радио";
      $("coverText").textContent = current.abbr || initials(current.name);
      setCoverLogo(current);
      applyTheme(current);
      document.title = `${current.name} — онлайн-радио`;
      renderList();

      if ("mediaSession" in navigator && window.MediaMetadata) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: current.name, artist: "Онлайн-радио" });
      }
    }

    function initials(name) {
      return name.split(/\s+/).slice(0, 2).map((w) => w[0] || "").join("").toUpperCase() || "♪";
    }

    // ---------- Воспроизведение ----------
    // Если поток не запустился за 15 секунд, считаем его неработающим
    function startStallTimer() {
      clearTimeout(stallTimer);
      stallTimer = setTimeout(streamFailed, 15000);
    }

    function streamFailed() {
      clearTimeout(stallTimer);
      if (streamIndex < current.streams.length - 1) {
        streamIndex++;
        setStream();
        setStatus("Переключаю поток…");
        play();
      } else {
        failed.add(current.id);
        radio.pause();
        setPlayingUI(false);
        setStatus("Станция недоступна");
        renderList();
      }
    }

    async function play() {
      startStallTimer();
      try {
        await radio.play();
        setPlayingUI(true);
      } catch (e) {
        setPlayingUI(false);
        if (e && e.name === "NotAllowedError") setStatus("Нажми ▶ для запуска");
        // Остальные ошибки обрабатываются событием error у аудио
      }
    }

    function pause() {
      clearTimeout(stallTimer);
      radio.pause();
      setPlayingUI(false);
    }

    function setStream() {
      radio.src = current.streams[streamIndex];
    }

    function selectStation(station, autoplay = true) {
      current = station;
      streamIndex = 0;
      setStream();
      updateNowPlaying();
      if (autoplay) play();
      else setPlayingUI(false);
    }

    function stationIndex() {
      return allStations().findIndex((s) => s.id === current.id);
    }

    function allStations() {
      return [EUROPA, ...catalog];
    }

    function step(delta) {
      const all = allStations();
      let i = stationIndex();
      // пропускаем станции, которые уже не работали
      for (let k = 0; k < all.length; k++) {
        i = (i + delta + all.length) % all.length;
        if (!failed.has(all[i].id)) break;
      }
      selectStation(all[i], true);
    }

    // ---------- Управление ----------
    toggle.addEventListener("click", () => {
      if (radio.paused) play();
      else pause();
    });
    $("next").addEventListener("click", () => step(1));
    $("prev").addEventListener("click", () => step(-1));

    volume.addEventListener("input", () => {
      radio.volume = Number(volume.value) / 100;
      $("volumeValue").textContent = volume.value + "%";
    });

    radio.volume = 0.7;

    radio.addEventListener("playing", () => {
      clearTimeout(stallTimer);
      failed.delete(current.id);
      setPlayingUI(true);
    });
    radio.addEventListener("pause", () => { if (!radio.ended) setPlayingUI(false); });
    radio.addEventListener("waiting", () => setStatus("Буферизация…"));
    radio.addEventListener("error", () => {
      if (!radio.getAttribute("src")) return;
      streamFailed();
    });

    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("play", play);
      navigator.mediaSession.setActionHandler("pause", pause);
      navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
      navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
    }

    // ---------- Список станций ----------
    function renderList() {
      const q = search.value.trim().toLowerCase();
      const visible = allStations().filter((s) => !q || s.name.toLowerCase().includes(q));
      list.innerHTML = "";

      visible.forEach((s) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "station" + (s.id === current.id ? " active" : "") + (failed.has(s.id) ? " failed" : "");

        const avatar = document.createElement("span");
        avatar.className = "avatar";
        avatar.style.setProperty("--h", s.hue);
        appendLogo(avatar, s);

        const meta = document.createElement("span");
        meta.className = "meta";
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = s.name;
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = s.info || "Онлайн-радио";
        meta.append(name, sub);

        btn.append(avatar, meta);
        if (s.id === current.id) {
          const now = document.createElement("span");
          now.className = "now";
          now.textContent = isPlaying ? "♪ играет" : "выбрано";
          btn.append(now);
        }
        btn.addEventListener("click", () => selectStation(s, true));
        li.append(btn);
        list.append(li);
      });

      $("count").textContent = `${visible.length} из ${allStations().length}`;
    }

    search.addEventListener("input", renderList);

    async function loadCatalog() {
      $("listStatus").textContent = "Загружаю станции России…";
      for (const host of CATALOG_HOSTS) {
        try {
          const res = await fetch(`${host}/json/stations/bycountrycodeexact/RU?hidebroken=true&order=clickcount&reverse=true&limit=300`);
          if (!res.ok) continue;
          const data = await res.json();
          const seen = new Set();
          catalog = data
            .filter((s) => s.url_resolved && s.url_resolved.startsWith("https://"))
            .filter((s) => !/европа\s*плюс|europa\s*plus/i.test(s.name))
            .filter((s) => {
              const key = s.name.trim().toLowerCase();
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            })
            .map((s) => {
              const name = s.name.trim();
              const hue = hueOf(name);
              const parts = [s.codec, s.bitrate ? s.bitrate + " kbps" : ""].filter(Boolean);
              return {
                id: s.stationuuid,
                name,
                info: parts.join(" · ") || "Онлайн-радио",
                abbr: initials(name),
                hue,
                favicon: s.favicon && s.favicon.startsWith("https://") ? s.favicon : "",
                streams: [s.url_resolved]
              };
            });
          $("listStatus").textContent = catalog.length ? "" : "Станции не найдены";
          renderList();
          return;
        } catch {
          // пробуем следующий сервер
        }
      }
      $("listStatus").textContent = "Каталог станций сейчас недоступен. Доступна «Европа Плюс».";
      renderList();
    }

    // ---------- Старт ----------
    selectStation(EUROPA, false);
    renderList();
    loadCatalog();
    window.addEventListener("load", play);
  </script>
</body>
</html>
