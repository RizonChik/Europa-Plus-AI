<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#11131a" />
  <title>Европа Плюс — Live</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,52,127,.28), transparent 32rem),
        radial-gradient(circle at 80% 80%, rgba(70,89,255,.26), transparent 34rem),
        #0b0d12;
      color: #fff;
    }
    .player {
      width: min(92vw, 430px); padding: 32px; border-radius: 28px;
      background: rgba(18,21,30,.86); border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 28px 80px rgba(0,0,0,.45); backdrop-filter: blur(16px);
    }
    .badge { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .58; }
    h1 { margin: 8px 0 4px; font-size: 32px; }
    .subtitle { margin: 0 0 28px; opacity: .68; }
    .status { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-size: 14px; opacity: .82; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff347f; box-shadow: 0 0 14px #ff347f; }
    .controls { display: flex; align-items: center; gap: 18px; }
    button {
      width: 66px; height: 66px; border: 0; border-radius: 50%;
      background: #fff; color: #11131a; font-size: 28px; cursor: pointer;
      box-shadow: 0 10px 26px rgba(255,255,255,.16);
    }
    .volume { flex: 1; }
    .volume-row { display: flex; justify-content: space-between; font-size: 13px; opacity: .66; margin-bottom: 8px; }
    input[type=range] { width: 100%; accent-color: #ff347f; }
    .hint { margin-top: 24px; font-size: 12px; line-height: 1.45; opacity: .46; }
  </style>
</head>
<body>
  <main class="player">
    <div class="badge">LIVE RADIO</div>
    <h1>Европа Плюс</h1>
    <p class="subtitle">Прямой эфир</p>

    <div class="status"><span class="dot"></span><span id="status">Подключение…</span></div>

    <div class="controls">
      <button id="toggle" type="button" aria-label="Воспроизвести">▶</button>
      <div class="volume">
        <div class="volume-row"><span>Громкость</span><span id="volumeValue">70%</span></div>
        <input id="volume" type="range" min="0" max="100" value="70" />
      </div>
    </div>

    <p class="hint">Плеер пытается включиться автоматически. Некоторые браузеры запрещают автозапуск звука — тогда достаточно один раз нажать ▶.</p>

    <audio id="radio" preload="none" autoplay></audio>
  </main>

  <script>
    const streams = [
      "https://ep256.hostingradio.ru:8052/europaplus256.mp3",
      "https://epdop.hostingradio.ru:8033/europaplus32.aacp"
    ];

    const radio = document.getElementById("radio");
    const toggle = document.getElementById("toggle");
    const volume = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");
    const status = document.getElementById("status");

    let streamIndex = 0;
    radio.src = streams[streamIndex];
    radio.volume = 0.7;

    function setPlayingUI(playing) {
      toggle.textContent = playing ? "❚❚" : "▶";
      toggle.setAttribute("aria-label", playing ? "Пауза" : "Воспроизвести");
      status.textContent = playing ? "В эфире" : "Пауза";
    }

    async function play() {
      try {
        await radio.play();
        setPlayingUI(true);
      } catch {
        setPlayingUI(false);
        status.textContent = "Нажми ▶ для запуска";
      }
    }

    toggle.addEventListener("click", async () => {
      if (radio.paused) await play();
      else { radio.pause(); setPlayingUI(false); }
    });

    volume.addEventListener("input", () => {
      radio.volume = Number(volume.value) / 100;
      volumeValue.textContent = volume.value + "%";
    });

    radio.addEventListener("playing", () => setPlayingUI(true));
    radio.addEventListener("waiting", () => status.textContent = "Буферизация…");
    radio.addEventListener("error", async () => {
      if (streamIndex < streams.length - 1) {
        streamIndex++;
        radio.src = streams[streamIndex];
        status.textContent = "Переключаю поток…";
        await play();
      } else {
        status.textContent = "Поток временно недоступен";
        setPlayingUI(false);
      }
    });

    window.addEventListener("load", play);
  </script>
</body>
</html>
